<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>xrift-m2</title>
<style>
  /* M2 検証パターン専用。スクロールバー等が出ないようにする。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  /* HMD 操作ガイド（検証用オーバーレイ）。Chromium 合成で OSR 共有テクスチャに乗る。
     予約領域（上部の ID/タグブロック y=64〜96・マーカー y=8〜40）を避けて
     ページ高さの 40% から表示する（縦方向の中央。左右眼で読めるよう半分ごとに
     同じ内容を中央配置する。シーンのクアッドに重なるのは許容（ガイド優先））。 */
  #guide { position: absolute; left: 0; right: 0; top: 40%; bottom: auto; display: none;
    align-items: flex-start; pointer-events: none; z-index: 10; font-family: sans-serif; }
  #guide.on { display: flex; }
  .guide-eye { width: 50%; display: flex; justify-content: center; align-items: flex-start; }
  /* カード幅は各半分の 84% 程度。4098x2049 基準でメイン 96px 以上・サブ 54px 以上を
     保ち、行間・余白を広めに取る。背景は不透明寄りで HMD 内の視認性を優先する。 */
  .guide-card { width: 84%; max-width: 84%; background: rgba(0,0,0,0.78); color: #fff;
    border: 4px solid #fff; border-radius: 18px; padding: 28px 36px; text-align: center; }
  .guide-main { font-size: 96px; font-weight: bold; line-height: 1.25;
    overflow-wrap: break-word; word-break: break-word; }
  .guide-sub { margin-top: 16px; font-size: 54px; line-height: 1.35; color: #ffe27a;
    overflow-wrap: break-word; word-break: break-word; }
  .guide-dots { margin-top: 14px; font-size: 32px; letter-spacing: 6px; color: #888; }
  .guide-dots .done { color: #8f8; }
  .guide-dots .active { color: #ff0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guide" aria-hidden="true">
  <div class="guide-eye"><div class="guide-card">
    <div class="guide-main" id="guideMainL"></div>
    <div class="guide-sub" id="guideSubL"></div>
    <div class="guide-dots" id="guideDotsL"></div>
  </div></div>
  <div class="guide-eye"><div class="guide-card">
    <div class="guide-main" id="guideMainR"></div>
    <div class="guide-sub" id="guideSubR"></div>
    <div class="guide-dots" id="guideDotsR"></div>
  </div></div>
</div>
<script src="m2-codec.js"></script>
<script>
// M2 検証パターン（exe 側 src/transfer/xr_transfer_app.cpp と一致させること）。
// 配置は harness/electron/README.md の「M2 画像配置」が正典である。
//  - アトラスは左右横並び（左半分=左眼、右半分=右眼）
//  - ブロック A (64,64) 32x32: 使用レコードの renderId 下位 16bit
//  - ブロック B (128,64) 32x32: pose タグ 16bit（量子化 pose + 世代 + renderId の FNV-1a 下位）
//  - 左マーカー (160,8) 32x32 マゼンタ、右マーカー (halfW+160,8) 32x32 シアン
//  - シーンは視差付き（z=-2m の 3x3 クアッド、z=-5m のグリッド、空グラデーション）。
//    レンダラは受け取ったレコードの値だけで描く（ローカルカウンタを ID に使わない）。
//  - 注入フック ?staleRecord=N: N フレーム目だけ 1 つ前のレコードの pose でタグを
//    計算しつつ現レコードの ID を埋める（不一致として棄却される想定）。
// main プロセスは window.__m2push(record) で RenderRequest の内容を渡す。
// record: {renderId, connEpoch, spaceEpoch, leftPos[3], leftOri[4], rightPos[3],
//          rightOri[4], leftFov[4](l,r,u,d rad), rightFov[4], staleHint}
window.__m2Info = { backend: 'canvas2d-m2', frames: 0, lastRenderId: 0, lastTag: 0, staleAt: 0 };
const W = window.innerWidth, H = window.innerHeight, HALF = Math.floor(W / 2);
const QUERY = new URLSearchParams(location.search);
const STALE_AT = (() => {
  const v = parseInt(QUERY.get('staleRecord') || '0', 10);
  return (Number.isFinite(v) && v > 0) ? v : 0;
})();
// HMD 操作ガイド（HTML/CSS オーバーレイ）。WebGPU/canvas 描画には触らず、
// Chromium 合成で OSR 共有テクスチャに乗るだけであるため、パターン画素・
// 検査結果は変わらない。?guide=1 で有効、?guide=0 か無指定で無効
// （既定 off。main 側が M2 実機計測では on を渡す）。
const GUIDE_ON = QUERY.get('guide') === '1';
// 実機計測の操作手順。?guidePlan=default（現行 17 ステップ・約 80 秒）と
// ?guidePlan=short（短縮 13 ステップ・約 40 秒）を切り替える。既定は default。
// default は 4 秒刻みを基本に、haptics（20/30/40 秒）・脱着（55/60 秒）・
// 模擬 space 変更（70 秒）を置く。short は trigger/squeeze/stick・X/A・Y/B・
// menu・振動 2 回だけに絞った 40 秒用である。
// 文言を変えても配置には影響しない（上部 40% からのみ。予約領域と重ならない）。
// 各ラベルは 20 文字以内に収める（メイン行の「番号: ラベル」全体で 26 文字以内になる）。
const GUIDE_PLAN = QUERY.get('guidePlan') === 'short' ? 'short' : 'default';
const GUIDE_STEPS_DEFAULT = [
  { t: 0, label: '装着を確認：この文字が見えればOK' },
  { t: 4, label: '1/8: 左 trigger を 1 秒押す' },
  { t: 8, label: '2/8: 右 trigger を 1 秒押す' },
  { t: 12, label: '3/8: 左 squeeze を 1 秒押す' },
  { t: 16, label: '4/8: 右 squeeze を 1 秒押す' },
  { t: 20, label: '振動 1/3：感じたら覚えておく' },
  { t: 24, label: '5/8: 左 stick を倒す' },
  { t: 28, label: '6/8: 右 stick を倒す' },
  { t: 30, label: '振動 2/3：感じたら覚えておく' },
  { t: 34, label: '7/8: A/X・Y/B を 1 秒押す' },
  { t: 38, label: '8/8: menu を 1 秒押す' },
  { t: 40, label: '振動 3/3：感じたら覚えておく' },
  { t: 44, label: '休み：そのまま装着' },
  { t: 55, label: 'ヘッドセットを外す' },
  { t: 60, label: '戻して装着' },
  { t: 70, label: 'space 変更（模擬）：動かず待つ' },
  { t: 76, label: '終了までそのまま' },
];
// 40 秒用の短縮プラン（13 ステップ。3 秒刻みを基本にする）。
const GUIDE_STEPS_SHORT = [
  { t: 0, label: '装着を確認：この文字が見えればOK' },
  { t: 4, label: '左 trigger を 1 秒押す' },
  { t: 7, label: '右 trigger を 1 秒押す' },
  { t: 10, label: '左 squeeze を 1 秒押す' },
  { t: 13, label: '右 squeeze を 1 秒押す' },
  { t: 16, label: '振動（感じたら覚えておく）' },
  { t: 19, label: '左 stick を倒す' },
  { t: 22, label: '右 stick を倒す' },
  { t: 25, label: '左 X → 右 A を 1 秒ずつ' },
  { t: 28, label: '左 Y → 右 B を 1 秒ずつ' },
  { t: 31, label: 'menu を 1 秒押す' },
  { t: 34, label: '振動（2 回目）' },
  { t: 37, label: '終了までそのまま' },
];
// 選択中のプランの手順を使う。不正値は default に寄せる（GUIDE_PLAN で正規化済み）。
const GUIDE_STEPS = GUIDE_PLAN === 'short' ? GUIDE_STEPS_SHORT : GUIDE_STEPS_DEFAULT;
const guideT0 = Date.now();
window.__guideInfo = { enabled: GUIDE_ON, plan: GUIDE_PLAN, steps: GUIDE_STEPS.length, idx: 0, elapsed: 0 };
function guideTick() {
  if (!GUIDE_ON) return;
  const elapsed = (Date.now() - guideT0) / 1000;
  let idx = 0;
  for (let i = 0; i < GUIDE_STEPS.length; i++) {
    if (elapsed >= GUIDE_STEPS[i].t) idx = i;
  }
  const cur = GUIDE_STEPS[idx];
  const next = idx + 1 < GUIDE_STEPS.length ? GUIDE_STEPS[idx + 1] : null;
  const remain = next ? Math.max(0, next.t - elapsed) : 0;
  const main = `${idx + 1}/${GUIDE_STEPS.length}: ${cur.label}`;
  // サブ行は 1 行 26 文字以内に収めるため「あとX秒 → 次: ラベル」だけにする。
  // 経過秒は __guideInfo.elapsed に残し、表示では落とす（残り秒と次の手順は維持する）。
  const sub = next
    ? `あと${remain.toFixed(0)}秒→次: ${next.label}`
    : `このまま終了まで`;
  for (const sfx of ['L', 'R']) {
    document.getElementById('guideMain' + sfx).textContent = main;
    document.getElementById('guideSub' + sfx).textContent = sub;
  }
  window.__guideInfo.idx = idx;
  window.__guideInfo.elapsed = elapsed;
}
if (GUIDE_ON) {
  document.getElementById('guide').classList.add('on');
  // 進捗ドットは手順数だけ作り、現在をハイライトする（タイムライン表示）。
  for (const sfx of ['L', 'R']) {
    const dots = document.getElementById('guideDots' + sfx);
    for (let i = 0; i < GUIDE_STEPS.length; i++) {
      const s = document.createElement('span');
      s.textContent = '●';
      dots.appendChild(s);
    }
  }
  const dotsTick = () => {
    if (!GUIDE_ON) return;
    for (const sfx of ['L', 'R']) {
      const dots = document.getElementById('guideDots' + sfx).children;
      for (let i = 0; i < dots.length; i++) {
        dots[i].className = i < window.__guideInfo.idx ? 'done'
          : (i === window.__guideInfo.idx ? 'active' : '');
      }
    }
  };
  const guideLoop = () => { guideTick(); dotsTick(); setTimeout(guideLoop, 200); };
  guideLoop();
  console.log('[m2] guide=on plan=' + GUIDE_PLAN + ' steps=' + GUIDE_STEPS.length);
} else {
  console.log('[m2] guide=off');
}

// ---- C++ 側との共有定義は m2-codec.js が持つ（render_record.h と一致） ----
const { quantizePos, quantizeOri, poseTag } = window.__m2codec;

// ---- レコード受け口 ----
const recordQueue = [];
let currentRecord = null;
let prevRecord = null;
window.__m2push = function (rec) {
  recordQueue.push(rec);
};

// ---- 3D 数学（視差用。依存ライブラリは使わない） ----
function quatToMat(q) {
  const [x, y, z, w] = q;
  const xx = x * x, yy = y * y, zz = z * z;
  const xy = x * y, xz = x * z, yz = y * z;
  const wx = w * x, wy = w * y, wz = w * z;
  return [
    [1 - 2 * (yy + zz), 2 * (xy - wz), 2 * (xz + wy)],
    [2 * (xy + wz), 1 - 2 * (xx + zz), 2 * (yz - wx)],
    [2 * (xz - wy), 2 * (yz + wx), 1 - 2 * (xx + yy)],
  ];
}
// 世界点 → 眼空間（R^T (w - p)。前方 -Z）。
function toEye(w, p, Rt) {
  const d = [w[0] - p[0], w[1] - p[1], w[2] - p[2]];
  return [
    Rt[0][0] * d[0] + Rt[1][0] * d[1] + Rt[2][0] * d[2],
    Rt[0][1] * d[0] + Rt[1][1] * d[1] + Rt[2][1] * d[2],
    Rt[0][2] * d[0] + Rt[1][2] * d[1] + Rt[2][2] * d[2],
  ];
}
function transpose3(m) {
  return [[m[0][0], m[1][0], m[2][0]], [m[0][1], m[1][1], m[2][1]], [m[0][2], m[1][2], m[2][2]]];
}
// 眼空間 → 半分内画素。fov は [l, r, u, d]（tan ではなく rad。ここで tan を取る）。
// 後方・至近は null を返す。
function project(v, fov, halfW, halfH) {
  if (v[2] > -0.05) return null;
  const tanL = Math.tan(fov[0]), tanR = Math.tan(fov[1]);
  const tanU = Math.tan(fov[2]), tanD = Math.tan(fov[3]);
  // 縮退した FOV（左右・上下の開きが無い）は投影できない。NaN を広げない。
  if (!(tanR > tanL) || !(tanU > tanD)) return null;
  const ux = v[0] / -v[2], uy = v[1] / -v[2];
  const sx = ((ux - tanL) / (tanR - tanL)) * halfW;
  const sy = (1 - (uy - tanD) / (tanU - tanD)) * halfH;
  return [sx, sy];
}

// シーン定義（ワールド固定。pose が動くと視差でずれる）。
const QUADS = [];
{
  const colors = ['#ff4040', '#40ff40', '#4040ff', '#ffff40', '#ff40ff', '#40ffff',
                  '#ff8040', '#80ff80', '#ffffff'];
  let k = 0;
  for (let iy = 0; iy < 3; iy++) {
    for (let ix = 0; ix < 3; ix++) {
      QUADS.push({
        cx: (ix - 1) * 0.5, cy: 1.1 + iy * 0.5, cz: -2.0, half: 0.15,
        color: colors[k++],
      });
    }
  }
}
const GRID = [];
for (let i = -5; i <= 5; i++) {
  GRID.push({ a: [i, 0, -5], b: [i, 3, -5] });
  GRID.push({ a: [-5, i < 0 ? 0 : i * 0.5, -5], b: [5, i < 0 ? 0 : i * 0.5, -5] });
}

function drawEye(ctx, eye, rec, x0) {
  const halfW = HALF, halfH = H;
  const pos = eye === 0 ? rec.leftPos : rec.rightPos;
  const ori = eye === 0 ? rec.leftOri : rec.rightOri;
  const fov = eye === 0 ? rec.leftFov : rec.rightFov;
  const Rt = transpose3(quatToMat(ori));

  // 空グラデーション。水平線は眼高さを 10m 先に投影した位置にする（pose 追従）。
  const fw = [
    Rt[0][0] * 0 + Rt[1][0] * 0 + Rt[2][0] * -1,
    Rt[0][1] * 0 + Rt[1][1] * 0 + Rt[2][1] * -1,
    Rt[0][2] * 0 + Rt[1][2] * 0 + Rt[2][2] * -1,
  ];
  const ahead = [pos[0] + fw[0] * 10, pos[1] + fw[1] * 10, pos[2] + fw[2] * 10];
  const hp = project(toEye(ahead, pos, Rt), fov, halfW, halfH);
  const horizon = hp ? Math.max(0, Math.min(halfH, hp[1])) : halfH * 0.5;
  const grad = ctx.createLinearGradient(0, 0, 0, halfH);
  grad.addColorStop(0, '#001133');
  grad.addColorStop(Math.max(0, Math.min(1, horizon / halfH)), '#2a6a8a');
  grad.addColorStop(1, '#050505');
  ctx.fillStyle = grad;
  ctx.fillRect(x0, 0, halfW, halfH);

  // z=-5m グリッド。
  ctx.strokeStyle = 'rgba(120,160,200,0.8)';
  ctx.lineWidth = 2;
  for (const g of GRID) {
    const pa = project(toEye(g.a, pos, Rt), fov, halfW, halfH);
    const pb = project(toEye(g.b, pos, Rt), fov, halfW, halfH);
    if (!pa || !pb) continue;
    ctx.beginPath();
    ctx.moveTo(x0 + pa[0], pa[1]);
    ctx.lineTo(x0 + pb[0], pb[1]);
    ctx.stroke();
  }
  // z=-2m の 3x3 色クアッド。
  for (const q of QUADS) {
    const corners = [
      [q.cx - q.half, q.cy - q.half, q.cz],
      [q.cx + q.half, q.cy - q.half, q.cz],
      [q.cx + q.half, q.cy + q.half, q.cz],
      [q.cx - q.half, q.cy + q.half, q.cz],
    ];
    const pts = corners.map((c) => project(toEye(c, pos, Rt), fov, halfW, halfH));
    if (pts.some((p) => p === null)) continue;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.moveTo(x0 + pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(x0 + pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  // 眼識別の微差ではなく視差そのものが左右差になる。固定の眼帯は付けない。
}

function drawBlock16(ctx, ox, oy, value) {
  for (let b = 0; b < 16; b++) {
    const on = ((value >>> b) & 1) === 1;
    ctx.fillStyle = on ? '#ffffff' : '#000000';
    ctx.fillRect(ox + (b % 8) * 4, oy + Math.floor(b / 8) * 4, 4, 4);
  }
}

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
let frames = 0;
window.__m2Info.staleAt = STALE_AT;
console.log('[m2] renderer start size=' + W + 'x' + H + ' staleRecord=' + STALE_AT);

function placeholder() {
  // レコード未受信時。ID 0（無効）のため exe 側で棄却される。黙って止めない。
  ctx.fillStyle = '#101010';
  ctx.fillRect(0, 0, W, H);
  drawBlock16(ctx, 64, 64, 0);
  drawBlock16(ctx, 128, 64, 0);
  ctx.fillStyle = '#ff00ff'; ctx.fillRect(160, 8, 32, 32);
  ctx.fillStyle = '#00ffff'; ctx.fillRect(HALF + 160, 8, 32, 32);
}

function draw() {
  frames++;
  while (recordQueue.length > 0) {
    prevRecord = currentRecord;
    currentRecord = recordQueue.shift();
    // 溜めすぎない（最新優先）。古い要求は捨てる。
    if (recordQueue.length > 4) {
      prevRecord = recordQueue[recordQueue.length - 1];
      currentRecord = recordQueue.pop();
      recordQueue.length = 0;
    }
  }
  if (!currentRecord) {
    placeholder();
    window.__m2Info.frames = frames;
    requestAnimationFrame(draw);
    return;
  }
  const rec = currentRecord;
  const renderId = Number(rec.renderId);
  const id16 = renderId & 0xFFFF;
  // 注入フック: 指定フレームは 1 つ前の pose でタグを計算する（ID は現行）。
  // in-band の staleHint（exe の --inject-stale-record）でも発火する。
  const staleFire = (STALE_AT !== 0 && frames === STALE_AT) || rec.staleHint === true;
  const tagPoseRec = (staleFire && prevRecord) ? prevRecord : rec;
  if (staleFire) {
    window.__m2Info.staleAt = frames;
    console.log('[m2] stale inject at frame=' + frames + ' renderId=' + renderId);
    rec.staleHint = false; // 1 回だけ発火する。
  }
  const tag = poseTag(BigInt(renderId), rec.connEpoch >>> 0, rec.spaceEpoch >>> 0,
    { position: tagPoseRec.leftPos, orientation: tagPoseRec.leftOri },
    { position: tagPoseRec.rightPos, orientation: tagPoseRec.rightOri });

  // 左右の視差シーン。
  const eyeRec = {
    leftPos: rec.leftPos, leftOri: rec.leftOri, leftFov: rec.leftFov,
    rightPos: rec.rightPos, rightOri: rec.rightOri, rightFov: rec.rightFov,
  };
  drawEye(ctx, 0, eyeRec, 0);
  drawEye(ctx, 1, eyeRec, HALF);

  // 予約ブロックと眼マーカー（シーンの上から上書きする）。
  drawBlock16(ctx, 64, 64, id16);
  drawBlock16(ctx, 128, 64, tag);
  ctx.fillStyle = '#ff00ff'; ctx.fillRect(160, 8, 32, 32);
  ctx.fillStyle = '#00ffff'; ctx.fillRect(HALF + 160, 8, 32, 32);

  window.__m2Info.frames = frames;
  window.__m2Info.lastRenderId = renderId;
  window.__m2Info.lastTag = tag;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
