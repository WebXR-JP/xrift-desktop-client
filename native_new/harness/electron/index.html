<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>xrift-m1</title>
<style>
  /* M1 検証パターン専用。スクロールバー等が出ないようにする。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// M1 検証パターン（exe 側 shared_texture.cpp の定数と一致させること）。
// バッキングサイズはウィンドウに合わせる（devicePixelRatio は使わない）。
// 既定の起動（4096x2048）では 4096x2048 になる。
// 背景はフレーム番号に応じた単調変化のグレー、4 隅に 64x64 の固定色、
// (64,64) から 32x32 の領域に 16bit フレーム番号を 4x4 セルで描く
//（bit b: x=64+(b%8)*4, y=64+floor(b/8)*4。1=白/0=黒）。
window.__m1Info = { backend: 'none', error: null, frames: 0 };
const W = window.innerWidth, H = window.innerHeight;

async function boot() {
  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  if (navigator.gpu) {
    try {
      await runWebGPU(canvas);
      return;
    } catch (e) {
      window.__m1Info = { backend: 'none', error: 'webgpu-failed: ' + (e && e.message), frames: 0 };
      console.log('[m1] webgpu failed, fallback to canvas2d: ' + (e && e.message));
    }
  } else {
    console.log('[m1] navigator.gpu missing, use canvas2d');
  }
  runCanvas2D(canvas);
}

async function runWebGPU(canvas) {
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('requestAdapter returned null');
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  const code = `
struct U { frame : u32 };
@group(0) @binding(0) var<uniform> u : U;
struct VSOut { @builtin(position) pos : vec4f };
@vertex fn vs(@builtin(vertex_index) i : u32) -> VSOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o : VSOut;
  o.pos = vec4f(p[i], 0.0, 1.0);
  return o;
}
@fragment fn fs(in : VSOut) -> @location(0) vec4f {
  let px = vec2u(in.pos.xy);
  let frame = u.frame;
  // 4 隅の 64x64 固定色（左上=赤、右上=緑、左下=青、右下=白）。
  if (px.x < 64u && px.y < 64u) { return vec4f(1.0, 0.0, 0.0, 1.0); }
  if (px.x >= (${W}u - 64u) && px.y < 64u) { return vec4f(0.0, 1.0, 0.0, 1.0); }
  if (px.x < 64u && px.y >= (${H}u - 64u)) { return vec4f(0.0, 0.0, 1.0, 1.0); }
  if (px.x >= (${W}u - 64u) && px.y >= (${H}u - 64u)) { return vec4f(1.0, 1.0, 1.0, 1.0); }
  // フレーム番号ブロック（64,64）起点の 32x32。8 列 x 2 行の 4x4 セル。
  if (px.x >= 64u && px.x < 96u && px.y >= 64u && px.y < 72u) {
    let col = (px.x - 64u) / 4u;
    let row = (px.y - 64u) / 4u;
    let b = row * 8u + col;
    let bit = (frame >> b) & 1u;
    if (bit == 1u) { return vec4f(1.0, 1.0, 1.0, 1.0); }
    return vec4f(0.0, 0.0, 0.0, 1.0);
  }
  // 背景はフレーム番号に応じた単調変化（256 階調のグレー）。
  let v = f32(frame & 255u) / 255.0;
  return vec4f(v, v, v, 1.0);
}`;
  const module = device.createShaderModule({ code });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const ubuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: ubuf } }],
  });
  const uarr = new Uint32Array(4);
  let frame = 0;
  window.__m1Info = { backend: 'webgpu', error: null, frames: 0, format };
  console.log('[m1] renderer backend=webgpu format=' + format + ' size=' + W + 'x' + H);

  function draw() {
    frame = (frame + 1) & 0xFFFF;
    uarr[0] = frame;
    device.queue.writeBuffer(ubuf, 0, uarr);
    const enc = device.createCommandEncoder();
    const view = ctx.getCurrentTexture().createView();
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);
    window.__m1Info.frames = frame;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function runCanvas2D(canvas) {
  const ctx = canvas.getContext('2d');
  let frame = 0;
  window.__m1Info = { backend: 'canvas2d', error: null, frames: 0 };
  console.log('[m1] renderer backend=canvas2d size=' + W + 'x' + H);
  function draw() {
    frame = (frame + 1) & 0xFFFF;
    const v = frame & 255;
    ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#00ff00'; ctx.fillRect(W - 64, 0, 64, 64);
    ctx.fillStyle = '#0000ff'; ctx.fillRect(0, H - 64, 64, 64);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(W - 64, H - 64, 64, 64);
    for (let b = 0; b < 16; b++) {
      const on = ((frame >> b) & 1) === 1;
      ctx.fillStyle = on ? '#ffffff' : '#000000';
      ctx.fillRect(64 + (b % 8) * 4, 64 + Math.floor(b / 8) * 4, 4, 4);
    }
    window.__m1Info.frames = frame;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

boot();
</script>
</body>
</html>
