<!doctype html>
<meta charset="utf-8">
<title>XRift VR selftest (heavy)</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100vw!important;height:100vh!important}</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three'
const q = new URLSearchParams(location.search)
const aa = q.get('aa') !== '0'
const renderer = new THREE.WebGLRenderer({ antialias: aa })
renderer.setSize(innerWidth, innerHeight)
renderer.xr.enabled = true
renderer.shadowMap.enabled = true
renderer.toneMapping = THREE.ACESFilmicToneMapping
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x335577)
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.5))
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 10, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x777777 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor)
const geo = [new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.SphereGeometry(0.25, 24, 16), new THREE.TorusKnotGeometry(0.2, 0.06, 96, 12)]
const meshes = []
for (let i = 0; i < 1500; i++) {
  const m = new THREE.Mesh(geo[i % 3], new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.6, 0.5), roughness: 0.5, metalness: 0.2 }))
  m.position.set((Math.random() - 0.5) * 30, Math.random() * 4, (Math.random() - 0.5) * 30)
  m.castShadow = m.receiveShadow = true
  scene.add(m); meshes.push(m)
}
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200)
renderer.setAnimationLoop((t) => { for (let i = 0; i < meshes.length; i += 7) meshes[i].rotation.y = t / 1000; renderer.render(scene, cam) })
window.addEventListener('error', (e) => console.log('[XRift VR] page error', e.message))
const session = await navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] })
await renderer.xr.setSession(session)
console.log('[XRift VR] heavy selftest started aa=' + aa)
</script>
